services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: schoolum
    volumes:
      - db_data:/var/lib/postgresql/data
    # Deliberately no "ports:" mapping — Postgres is reachable only from
    # other containers on this compose network, never from the internet.
    # To inspect it directly from the host during setup, temporarily add
    # `ports: ["127.0.0.1:5432:5432"]` here and remove it again after.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolum"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://schoolum:${POSTGRES_PASSWORD}@db:5432/schoolum?schema=public
      DIRECT_URL: postgresql://schoolum:${POSTGRES_PASSWORD}@db:5432/schoolum?schema=public
    depends_on:
      db:
        condition: service_healthy
    # No "ports:" here either — only Caddy is reachable from outside this
    # server; the app is only reachable through it, on the compose network.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
