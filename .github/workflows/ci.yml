name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_app
          POSTGRES_PASSWORD: saas_ci_password
          POSTGRES_DB: saas_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://saas_app:saas_ci_password@localhost:5432/saas_platform?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-not-for-production-use
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
